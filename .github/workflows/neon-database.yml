  #       env:
  #         POSTGRES_USER: keycade
  #         POSTGRES_PASSWORD: keycade_ci_only
  #         POSTGRES_DB: keycade
  #       ports:
  #         - 5432:5432
  #       options: >-
  #         --health-cmd "pg_isready -U keycade -d keycade"
  #         --health-interval 5s
  #         --health-timeout 5s
  #         --health-retries 12
  #   steps:
  #     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #       with:
  #         persist-credentials: false
  #     - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
  #       with:
  #         run_install: false
  #     - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
  #       with:
  #         node-version-file: .nvmrc
  #         cache: pnpm
  #     - run: pnpm install --frozen-lockfile
  #     - run: pnpm check
  #     - run: pnpm build
  #     - name: Test with disposable PostgreSQL databases
  #       run: pnpm exec vitest run .integration.test.ts
  #       env:
  #         TEST_DATABASE_URL: postgresql://keycade:keycade_ci_only@127.0.0.1:5432/keycade
  #
  migrate:
    name: Apply migrations to Neon
    if: vars.NEON_MIGRATIONS_ENABLED == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: neon-production
    concurrency:
      group: neon-production-migrations
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply only pending committed migrations
        run: pnpm db:migrate:neon
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          NEON_DATABASE_HOST: ${{ vars.NEON_DATABASE_HOST }}
          NEON_DATABASE_NAME: ${{ vars.NEON_DATABASE_NAME }}
      - name: Configure approved application database login
        if: vars.NEON_RUNTIME_SETUP_ENABLED == 'true'
        run: pnpm exec tsx scripts/neon-runtime.ts
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          NEON_DATABASE_HOST: ${{ vars.NEON_DATABASE_HOST }}
          NEON_DATABASE_NAME: ${{ vars.NEON_DATABASE_NAME }}
          NEON_RUNTIME_PASSWORD: ${{ secrets.NEON_RUNTIME_PASSWORD }}
