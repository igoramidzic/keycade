name: Neon database migrations

on:
  push:
    branches: [main]
    paths:
      - "packages/db/**"
      - "packages/config/**"
      - "scripts/neon-migrate*"
      - "scripts/neon-runtime*"
      - "scripts/local-lib*"
      - ".env.example"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".nvmrc"
      - "vitest.config.ts"
      - ".github/workflows/neon-database.yml"
  # Demo mode: PR validation is paused with the validate job below.
  # pull_request:
  #   branches: [main]
  #   paths:
  #     - "packages/db/**"
  #     - "packages/config/**"
  #     - "scripts/neon-migrate*"
  #     - "scripts/local-lib*"
  #     - ".env.example"
  #     - "package.json"
  #     - "pnpm-lock.yaml"
  #     - "pnpm-workspace.yaml"
  #     - ".nvmrc"
  #     - "vitest.config.ts"
  #     - ".github/workflows/neon-database.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Demo mode: pre-deployment tests/builds are paused at the user's request.
  # To restore: uncomment this job and the PR trigger; add needs: validate to migrate.
  # validate:
